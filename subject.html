<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aarova AI — Subject Chapters</title>
<meta name="description" content="Chapter-wise study material for GATE and IES preparation.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════
   DESIGN TOKENS — exactly matching Ch1
══════════════════════════════════════ */
:root {
  --bg:           #fdf6ee;
  --bg2:          #f8ede0;
  --bg3:          #f0e0cc;
  --bg4:          #e8d0b8;
  --text:         #1e1208;
  --text2:        #3d2010;
  --text3:        #6b3e22;
  --muted:        #9a6e50;
  --orange:       #c95f1a;
  --orange-md:    #e07235;
  --orange-lt:    #f5956a;
  --orange-bg:    #fdebd8;
  --orange-bdr:   #f0b48a;
  --green:        #2d6648;
  --green-bg:     #dff0e8;
  --green-bdr:    #8ecaaa;
  --green-lt:     #6ab88a;
  --teal:         #1e6b68;
  --teal-bg:      #d8eeed;
  --teal-bdr:     #7ec4c2;
  --teal-lt:      #4ea8a5;
  --amber:        #a05c00;
  --amber-bg:     #fef0d0;
  --amber-bdr:    #f0c060;
  --amber-lt:     #d4962a;
  --red:          #9a2020;
  --red-bg:       #fde8e8;
  --red-bdr:      #e89090;
  --border:       #ddc8b0;
  --border2:      #c8a888;
  --radius:       14px;
  --shadow:       0 2px 16px rgba(150,80,20,0.10);
  --shadow-md:    0 6px 28px rgba(150,80,20,0.14);
  --shadow-lg:    0 12px 48px rgba(150,80,20,0.18);

  /* Dynamic per-subject (overridden by JS) */
  --accent:       var(--orange);
  --accent-bg:    var(--orange-bg);
  --accent-bdr:   var(--orange-bdr);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; font-size:18px; }
body {
  background: var(--bg);
  color: var(--text2);
  font-family: 'Lora', Georgia, serif;
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:var(--bg2); }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

/* ══ HEADER ══ */
.site-header {
  position: sticky; top:0; z-index:100;
  background: rgba(253,246,238,0.96);
  backdrop-filter: blur(12px);
  border-bottom: 1.5px solid var(--border);
  padding: 14px clamp(20px,5vw,64px);
  display: flex; align-items:center; justify-content:space-between; gap:12px;
}
.logo {
  font-family: 'Playfair Display', serif;
  font-size: clamp(15px, 2.5vw, 19px);
  font-weight: 800;
  color: var(--orange);
  text-decoration: none;
}
.logo span {
  font-weight: 400; font-size: 12px;
  color: var(--muted); font-family: 'Lora', serif; margin-left: 10px;
}
.hbadges { display:flex; gap:6px; flex-wrap:wrap; }
.hbadge {
  font-size: 11px; font-weight: 600;
  padding: 3px 11px; border-radius: 20px;
  background: var(--orange-bg); border: 1px solid var(--orange-bdr);
  color: var(--orange); white-space: nowrap;
  font-family: 'JetBrains Mono', monospace;
}

/* ══ PAGE WRAPPER ══ */
.page {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 clamp(16px, 4vw, 48px) 100px;
}

/* ══ BREADCRUMB NAV ══ */
.breadcrumb {
  padding: 16px 0 0;
  display: flex; align-items:center; gap: 8px;
  font-size: 13px; color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
}
.breadcrumb a {
  color: var(--muted); text-decoration: none;
  transition: color 0.15s;
}
.breadcrumb a:hover { color: var(--orange); }
.breadcrumb .sep { color: var(--border2); }
.breadcrumb .current { color: var(--text3); font-weight: 600; }

/* ══ HERO ══ */
.hero {
  padding: clamp(28px,5vw,52px) 0 clamp(22px,4vw,36px);
  border-bottom: 1.5px solid var(--border);
  margin-bottom: clamp(24px,4vw,40px);
}
.eyebrow {
  font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.16em;
  color: var(--orange);
  margin-bottom: 12px;
  display: flex; align-items:center; gap:10px;
}
.eyebrow::before {
  content:''; display:inline-block;
  width:28px; height:2.5px;
  background:var(--orange); border-radius:2px;
}
h1.hero-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(28px, 5vw, 46px);
  font-weight: 800; color: var(--text);
  line-height: 1.12; margin-bottom: 14px;
}
h1.hero-title em { font-style:italic; color:var(--orange); }
.hero-desc {
  font-size: clamp(14px,1.8vw,16px);
  color: var(--text3); max-width: 600px;
  line-height: 1.75; font-weight: 400;
  margin-bottom: 20px;
}
.badge-row { display:flex; flex-wrap:wrap; gap:8px; }
.badge {
  font-size: 12px; padding: 4px 13px;
  border-radius: 20px;
  border: 1.5px solid var(--border2);
  color: var(--text3); background: var(--bg2);
  font-family: 'Lora', serif;
}
.badge-p {
  background: var(--orange-bg); border-color: var(--orange-bdr);
  color: var(--orange); font-weight: 600;
}

/* ══ PROGRESS BAR ══ */
.progress-bar {
  display: flex; align-items:center; gap:14px;
  background: var(--orange-bg);
  border: 1.5px solid var(--orange-bdr);
  border-radius: 10px; padding: 13px 20px;
  margin-bottom: clamp(20px,4vw,36px);
}
.pl { font-size:13px; font-weight:600; color:var(--orange); white-space:nowrap; }
.pt { flex:1; height:7px; background:rgba(201,95,26,0.18); border-radius:4px; overflow:hidden; min-width:40px; }
.pf { height:100%; background:var(--orange); border-radius:4px; transition:width 0.6s ease; }
.pp { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--orange); white-space:nowrap; }

/* ══ CHAPTER GRID ══ */
.chapters-label {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--muted);
  margin-bottom: 18px;
  display: flex; align-items:center; gap:14px;
}
.chapters-label::after {
  content: ''; flex:1; height: 1.5px; background: var(--border);
}

.chapters-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

/* ══ CHAPTER CARD ══ */
.ch-card {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: box-shadow 0.22s, transform 0.18s, border-color 0.2s;
  display: flex; flex-direction: column;
  position: relative;
}
.ch-card.available {
  cursor: pointer;
}
.ch-card.available:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-3px);
  border-color: var(--orange-bdr);
}
.ch-card.locked {
  opacity: 0.75;
}

/* Left accent border */
.ch-card.available { border-left: 4px solid var(--orange); }
.ch-card.locked    { border-left: 4px solid var(--border2); }

.ch-body {
  padding: clamp(16px,2.5vw,24px);
  display: flex; gap: 20px; align-items: flex-start; flex: 1;
}

/* Chapter number badge */
.ch-num-wrap {
  flex-shrink: 0;
  display: flex; flex-direction:column; align-items:center; gap: 6px;
}
.ch-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700;
  padding: 4px 12px; border-radius: 6px;
  white-space: nowrap;
}
.ch-num-active {
  background: var(--orange-bg); border: 1px solid var(--orange-bdr);
  color: var(--orange);
}
.ch-num-locked {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--muted);
}

.ch-content { flex: 1; }

.ch-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(16px, 2.2vw, 20px);
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
  line-height: 1.25;
}
.ch-locked .ch-title { color: var(--text3); }

.ch-desc {
  font-size: clamp(13px, 1.7vw, 14.5px);
  color: var(--text3); line-height: 1.65;
  margin-bottom: 14px;
}

.ch-topics {
  display: flex; flex-wrap:wrap; gap: 6px;
  margin-bottom: 0;
}
.topic-tag {
  font-size: 11px; font-weight: 600;
  padding: 2px 9px; border-radius: 12px;
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
}

.ch-aside {
  flex-shrink: 0;
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 10px;
  min-width: 110px;
}

.gate-rel {
  text-align: right;
}
.gate-rel-lbl {
  font-size: 9.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted); display: block; margin-bottom: 2px;
  font-family: 'JetBrains Mono', monospace;
}
.gate-rel-stars {
  font-size: 13px; color: var(--orange);
  letter-spacing: -1px;
}

.diff-badge {
  font-size: 10px; font-weight: 700;
  padding: 2px 9px; border-radius: 10px;
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase; letter-spacing: 0.05em;
  white-space: nowrap;
}
.diff-foundation { background: var(--green-bg); border: 1px solid var(--green-bdr); color: var(--green); }
.diff-intermediate { background: var(--orange-bg); border: 1px solid var(--orange-bdr); color: var(--orange); }
.diff-advanced { background: var(--teal-bg); border: 1px solid var(--teal-bdr); color: var(--teal); }
.diff-locked { background: var(--bg3); border: 1px solid var(--border); color: var(--muted); }

.study-btn {
  display: inline-flex; align-items:center; gap: 5px;
  font-size: 12px; font-weight: 700;
  padding: 7px 14px; border-radius: 7px;
  border: 1.5px solid var(--orange-bdr);
  background: var(--orange-bg); color: var(--orange);
  text-decoration: none; transition: all 0.18s;
  font-family: 'Lora', serif; white-space: nowrap;
}
.study-btn:hover {
  background: var(--orange); color: #fff; border-color: var(--orange);
}
.study-btn.soon {
  background: var(--bg3); border-color: var(--border);
  color: var(--muted); cursor: not-allowed;
}
.study-btn.soon:hover {
  background: var(--bg3); color: var(--muted); border-color: var(--border);
}

/* ══ FOOTER ══ */
footer {
  text-align:center; padding:30px 0;
  font-size:13px; color:var(--muted);
  border-top:1.5px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
}
footer strong { color:var(--orange); font-family: 'Playfair Display', serif; }

/* ══ ANIMATIONS ══ */
@keyframes rise {
  from { opacity:0; transform:translateY(14px); }
  to   { opacity:1; transform:none; }
}
.ch-card {
  opacity:0; transform:translateY(14px);
  animation: rise 0.4s forwards;
}

/* ══ RESPONSIVE ══ */
@media (max-width: 680px) {
  html { font-size: 17px; }
  .logo span { display: none; }
  .ch-aside { display: none; }
  .hbadges { display: none; }
}
@media (max-width: 480px) {
  html { font-size: 16px; }
  .ch-body { gap: 12px; }
}
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<header class="site-header">
  <a href="index.html" class="logo">Aarova AI <span>Study Platform</span></a>
  <div class="hbadges">
    <span class="hbadge" id="hbadge1">GATE EE</span>
    <span class="hbadge" id="hbadge2">IES</span>
    <span class="hbadge" id="hbadge3">PSU</span>
  </div>
</header>

<div class="page">

<!-- ══ BREADCRUMB ══ -->
<nav class="breadcrumb">
  <a href="index.html">🏠 Home</a>
  <span class="sep">›</span>
  <span class="current" id="breadcrumbCurrent">Loading…</span>
</nav>

<!-- ══ HERO ══ -->
<div class="hero" id="hero">
  <div class="eyebrow" id="eyebrow">Loading</div>
  <h1 class="hero-title" id="heroTitle">—</h1>
  <p class="hero-desc" id="heroDesc">—</p>
  <div class="badge-row" id="badgeRow"></div>
</div>

<!-- ══ PROGRESS BAR ══ -->
<div class="progress-bar">
  <span class="pl">Series Progress</span>
  <div class="pt"><div class="pf" id="progressFill" style="width:0%"></div></div>
  <span class="pp" id="progressText">0 of 0 chapters</span>
</div>

<!-- ══ CHAPTER LIST ══ -->
<div class="chapters-label">All Chapters</div>
<div class="chapters-grid" id="chaptersGrid"></div>

</div><!-- end .page -->

<footer>
  <strong>Aarova AI</strong> &nbsp;·&nbsp; <span id="footerSubject">Control Systems Series</span> &nbsp;·&nbsp; GATE EE / EC &nbsp;·&nbsp; IES E&amp;T &nbsp;·&nbsp; PSU Electrical
</footer>

<!-- ══ DATA + RENDER ══ -->
<script src="content/subjects.js"></script>
<script>
(function() {
  // ── Parse URL param ──
  const params = new URLSearchParams(window.location.search);
  const subjectId = params.get('s') || 'controlsystems';

  // ── Find subject ──
  const subj = AarovaData.subjects.find(s => s.id === subjectId);

  if (!subj) {
    document.getElementById('heroTitle').textContent = 'Subject Not Found';
    document.getElementById('heroDesc').textContent = 'Please go back to the home page.';
    return;
  }

  // ── Apply Accent Theme ──
  const root = document.documentElement;
  if (subj.accent) {
    root.style.setProperty('--accent', `var(--${subj.accent})`);
    root.style.setProperty('--accent-bg', `var(--${subj.accent}-bg)`);
    root.style.setProperty('--accent-bdr', `var(--${subj.accent}-bdr)`);
  }

  // ── Update page title ──
  document.title = `Aarova AI — ${subj.title}`;
  document.getElementById('breadcrumbCurrent').textContent = subj.title;
  document.getElementById('footerSubject').textContent = `${subj.title} Series`;

  // ── Hero ──
  const ECE_SUBJECTS = ['analog_and_digital','signalsandsystems','SemiConductors','communications','magnetics'];
  const streamLabel = ECE_SUBJECTS.includes(subj.id)
    ? 'Electronics & Communication Engineering'
    : 'Electrical Engineering';
  document.getElementById('eyebrow').textContent = `${subj.icon}  ${subj.title}  ·  ${streamLabel}`;
  document.getElementById('heroTitle').innerHTML = subj.title.replace(/&/g, '&amp;');
  document.getElementById('heroDesc').textContent = subj.description;

  // ── Exam badges ──
  const badgeRow = document.getElementById('badgeRow');
  subj.exam_tags.forEach((tag, i) => {
    const span = document.createElement('span');
    span.className = 'badge' + (i === 0 ? ' badge-p' : '');
    span.textContent = tag;
    badgeRow.appendChild(span);
  });
  const chSpan = document.createElement('span');
  chSpan.className = 'badge';
  chSpan.textContent = `${subj.total_chapters} Chapters Series`;
  badgeRow.appendChild(chSpan);

  // ── Progress ──
  const availCount = subj.chapters.filter(c => c.available).length;
  const totalCount = subj.total_chapters;
  const pct = totalCount > 0 ? Math.round((availCount / totalCount) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${availCount} of ${totalCount} chapters available`;

  // ── Difficulty badge class ──
  function diffClass(d) {
    if (!d) return 'diff-locked';
    const m = { 'Foundation':'diff-foundation','Intermediate':'diff-intermediate','Advanced':'diff-advanced' };
    return m[d] || 'diff-locked';
  }

  // ── Render chapter cards ──
  const grid = document.getElementById('chaptersGrid');
  const chapters = subj.chapters;

  // If no chapters defined, show placeholder message
  if (!chapters || chapters.length === 0) {
    grid.innerHTML = `<div style="padding:40px 0; text-align:center; color:var(--muted); font-size:15px;">
      Chapters for ${subj.title} are coming soon. Check back later!
    </div>`;
    return;
  }

  chapters.forEach((ch, idx) => {
    const isAvail = ch.available && ch.file;
    const numClass = isAvail ? 'ch-num-active' : 'ch-num-locked';
    const cardClass = isAvail ? 'available' : 'locked ch-locked';

    const topicsHtml = (ch.topics || []).map(t =>
      `<span class="topic-tag">${t}</span>`
    ).join('');

    const gateHtml = ch.gate_label
      ? `<div class="gate-rel">
           <span class="gate-rel-lbl">GATE Relevance</span>
           <div class="gate-rel-stars">${ch.gate_label}</div>
         </div>`
      : '';

    const diffHtml = ch.difficulty
      ? `<span class="diff-badge ${diffClass(ch.difficulty)}">${ch.difficulty}</span>`
      : `<span class="diff-badge diff-locked">—</span>`;

    const btnHtml = isAvail
      ? `<a href="${ch.file}" class="study-btn" id="ch-btn-${ch.num}">Study Chapter →</a>`
      : `<span class="study-btn soon">Coming Soon</span>`;

    const delay = (idx * 0.06 + 0.04).toFixed(2);

    const cardHtml = `
      <div class="ch-card ${cardClass}"
           style="animation-delay:${delay}s"
           ${isAvail ? `onclick="window.location='${ch.file.replace(/'/g, "\\'")}'"`  : ''}>
        <div class="ch-body">
          <div class="ch-num-wrap">
            <span class="ch-num ${numClass}">Ch.${ch.num}</span>
          </div>
          <div class="ch-content">
            <div class="ch-title">${ch.title}</div>
            <p class="ch-desc">${ch.description}</p>
            <div class="ch-topics">${topicsHtml}</div>
          </div>
          <div class="ch-aside">
            ${gateHtml}
            ${diffHtml}
            ${btnHtml}
          </div>
        </div>
      </div>`;

    grid.insertAdjacentHTML('beforeend', cardHtml);
  });

})();
</script>
</body>
</html>
